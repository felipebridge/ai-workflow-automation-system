name: Architecture Snapshot

on:
  schedule:
    # First of every month at 10:05 UTC
    - cron: '5 10 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — generate without committing'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  snapshot:
    name: Generate architecture snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate snapshot
        run: python .github/scripts/arch_snapshot.py

      - name: Check for changes
        id: check
        run: |
          git add .github/reports/arch/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            python .github/scripts/commit_validator.py
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit snapshot
        if: steps.check.outputs.changed == 'true' && !inputs.dry_run
        run: |
          git config user.name "felipebridge"
          git config user.email "felibridge49@gmail.com"
          git commit -m "docs: sync architecture snapshot [skip ci]"
          git push
